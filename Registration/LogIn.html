<html>
    <head>
        <title>Log In</title>
    </head>
    <body bgcolor="#ECD8C6">
        <header>
            <table>
                <tr><td bgcolor="#603E20"><img src="../src/Banner.jpg" alt="Banner"  width="1290" height="100"></td></tr>
                <tr>
                    <td bgcolor="#603E20">
                        <marquee scrollamount="20"><h1><font color="white">Log In</font></h1></marquee>
                    </td>
                </tr>
            </table>
        </header>

        <form>
            <table align="center">
                <!-- Space -->
                <tr><td height="50" colspan=5></td></tr>

                <tr>
                    <td colspan="2">
                        <table>
                            <!-- Username -->
                            <tr>
                                <td width="10"></td>
                                <td>Username</td>
                            </tr>

                            <!-- Username Field -->
                            <tr>
                                <td></td>
                                <td>
                                    <input  required type="text" name="username" placeholder="Insert Username" size="90">
                                </td>
                            </tr>

                            <!-- Space -->
                            <tr><td height="50" colspan=5></td></tr>

                            <!-- Password -->
                            <tr>
                                <td></td>
                                <td>Password</td>
                            </tr>

                            <!-- Password Field -->
                            <tr>
                                <td></td>
                                <td>
                                    <input required type="text" name="pwd" placeholder="Insert Password" size="90">
                                </td>
                            </tr>

                            <!-- Space -->
                            <tr><td height="25" colspan=5></td></tr>

                            <!-- Buttons -->
                            <tr>
                                <td colspan=2>
                                    <table>
                                        <tr>
                                            <!-- To push buttons to the right  -->
                                            <td align ="right" width="270"></td>

                                            <!-- Log In Button -->
                                            <td><button type="submit">Log In</button></td>

                                            <!-- Button seperator  -->
                                            <td width="10"></td>

                                            <!-- Reset Button -->
                                            <td align="left"><button type="reset">Reset</button></td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td width="605">
                    </td>
                    <td>
                        <!-- Sign Up Button -->
                        <button type="submit" formaction="SignUp.html" formnovalidate>SignUp</button>
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
