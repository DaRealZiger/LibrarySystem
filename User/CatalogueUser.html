<html>
    <head>
        <title>Catalogue</title>
    </head>
    <body>
        <header>
            <h1 align="center">Catalogue</h1>
        </header>

        <form>
            <table align="center" border="1">
                <!-- Table Header -->
                <tr height="40">
                    <td width="50" align="center">No.</td>
                    <td width="200" align="center">Title</td>
                    <td width="150" align="center">Language</td>
                    <td width="200" align="center">Author</td>
                    <td width="200" align="center">Publisher</td>
                    <td width="150" align="center">Status</td>
                </tr>

                <!-- First Book -->
                <tr height="58">
                    <td>&emsp;1.</td>
                    <td>&emsp;Patung Hina Hidup?</td>
                    <td>&emsp;Malay</td>
                    <td>&emsp;Honobu Yonezawa</td>
                    <td>&emsp;Kadokawa</td>
                    <td>&emsp;Available</td>
                    <td><button type="submit">Borrow</button></td>
                </tr>

                <!-- Second Book -->
                <tr height="58">
                    <td>&emsp;2.</td>
                    <td>&emsp;You've Reached Sam</td>
                    <td>&emsp;English</td>
                    <td>&emsp;Dustin Thao</td>
                    <td>&emsp;Wednesday Books</td>
                    <td>&emsp;Due:31/10/2026 </td>
                    <td><button type="submit">Return</button></td>
                </tr>

                <!-- Third Book -->
                <tr height="58">
                    <td>&emsp;3.</td>
                    <td>&emsp;White Tear</td>
                    <td>&emsp;Chinese</td>
                    <td>&emsp;Wei Jun</td>
                    <td>&emsp;Gempak Starz</td>
                    <td>&emsp;Available</td>
                    <td><button type="submit">Borrow</button></td>
                </tr>
            </table>
        </form>

        <!-- Buttons -->
        <table align="center">
            <tr>
                <!-- View Borrowed Button -->
                <td width="950">
                    <form action="./BorrowedBook.html">
                        <button type="submit">View Borrowed</button>
                    </form></td>

                    <!-- Log Out Button -->
                    <td align="right">
                        <form action="../LogIn.html">
                            <button type="submit">Log out</button>
                        </form></td>
            </tr>
        </table>
    </body>
</html>
