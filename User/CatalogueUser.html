<html>
    <head>
        <title>Catalogue</title>
    </head>
    <body bgcolor="#ECD8C6">
        <header>
            <table>
                <tr><td bgcolor="#603E20"><img src="../src/Banner.jpg" alt="Banner"  width="1290" height="100"></td></tr>
                <tr>
                    <td bgcolor="#603E20">
                        <marquee scrollamount="20"><h1><font color="white">Catalogue</font></h1></marquee>
                    </td>
                </tr>
            </table>
        </header>

        <form>
            <table align="center">

                <!-- Space -->
                <tr><td height="50" colspan=5></td></tr>
                <tr><td>
                        <table align="center" border="1">

                            <!-- Table Header -->
                            <tr height="40">
                                <td width="50" align="center"><b>No.</b></td>
                                <td width="200" align="center"><b>Title</b></td>
                                <td width="150" align="center"><b>Language</b></td>
                                <td width="200" align="center"><b>Author</b></td>
                                <td width="200" align="center"><b>Publisher</b></td>
                                <td width="150" align="center"><b>Status</b></td>
                            </tr>

                            <!-- First Book -->
                            <tr height="58">
                                <td>&emsp;1.</td>
                                <td>&emsp;Patung Hina Hidup?</td>
                                <td>&emsp;Malay</td>
                                <td>&emsp;Honobu Yonezawa</td>
                                <td>&emsp;Kadokawa</td>
                                <td>&emsp;Available</td>
                                <td><button type="submit">Borrow</button></td>
                            </tr>

                            <!-- Second Book -->
                            <tr height="58">
                                <td>&emsp;2.</td>
                                <td>&emsp;You've Reached Sam</td>
                                <td>&emsp;English</td>
                                <td>&emsp;Dustin Thao</td>
                                <td>&emsp;Wednesday Books</td>
                                <td>&emsp;<font color="Red">Due:31/10/2026</font></td>
                                <td><button type="submit">Return</button></td>
                            </tr>

                            <!-- Third Book -->
                            <tr height="58">
                                <td>&emsp;3.</td>
                                <td>&emsp;White Tear</td>
                                <td>&emsp;Chinese</td>
                                <td>&emsp;Wei Jun</td>
                                <td>&emsp;Gempak Starz</td>
                                <td>&emsp;Available</td>
                                <td><button type="submit">Borrow</button></td>
                            </tr>
                        </table>
                    </td></tr>
            </table>
        </form>

        <!-- Buttons -->
        <table align="center">
            <tr>
                <!-- View Borrowed Button -->
                <td width="950">
                    <form action="./BorrowedBooks.html">
                        <button type="submit">View Borrowed</button>
                    </form></td>

                    <!-- Log Out Button -->
                    <td align="right">
                        <form action="../LogIn.html">
                            <button type="submit">Log out</button>
                        </form></td>
            </tr>
        </table>
    </body>
</html>
