<html>
    <head>
        <title>Log In</title>
    </head>
    <body>
        <header>
            <h1 align=center>Log In</h1>
        </header>

        <form>
            <!-- <table border="1" align="center" > -->
            <table align="center" >
                <!-- Username -->
                <tr>
                    <td width="10"></td>
                    <td>Username</td>
                </tr>

                <!-- Username form -->
                <tr>
                    <td></td>
                    <td>
                        <input type="text" name="username" placeholder="Insert Username" size="90">
                    </td>
                </tr>

                <!-- Space -->
                <tr><td height="50" colspan=5></td></tr>

                <!-- Password -->
                <tr>
                    <td></td>
                    <td>Password</td>
                </tr>

                <!-- Password Form -->
                <tr>
                    <td></td>
                    <td>
                        <input type="text" name="pwd" placeholder="Insert Password" size="90">
                    </td>
                </tr>

                <!-- Space -->
                <tr><td height="25" colspan=5></td></tr>

                <!-- Buttons -->
                <tr>
                    <td colspan=2>
                        <table>
                            <tr>
                                <!-- To push buttons to the right  -->
                                <td align ="right" width="270"></td>

                                <!-- Log In Button -->
                                <td><button type="submit">Log In</button></td>

                                <!-- Button seperator  -->
                                <td width="10"></td>

                                <!-- Reset Button -->
                                <td align="left" width="270"><button type="reset">Reset</button></td>
        </form>
                                <!-- Sign Up Button -->
                                <form action="./SignUp.html">
                                    <td><button type="submit">Sign Up</button></td>
                                </form>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
    </body>
</html>
