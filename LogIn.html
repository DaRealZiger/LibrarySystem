<html>
   <head>
      <title>Log In</title>
   </head>
   <body>
      <header>
         <h1 align=center>Log In</h1>
      </header>

      <form>
         <table align="center" >
            <!-- Table width, use colspan="3" -->
            <tr><td width="200"></td><tr>

            <!-- Username -->
            <tr>
               <td colspan="3">Username</td>
            </tr>
            <tr>
               <td colspan="3">
                  <input type="text" name="username" size="90">
               </td>
            </tr>

            <!-- Space -->
            <tr><td colspan="3" height="50"></td></tr>

            <!-- Password -->
            <tr>
               <td colspan="3">Password</td>
            </tr>
            <tr>
               <td colspan="3">
                  <input type="text" name="password" size="90">
               </td>
            </tr>

            <!-- Space -->
            <tr><td colspan="3" height="25"></td></tr>

           <!-- Button  -->
           <tr align="center">
              <!-- Sign Up  -->
              <td>
                  <button type="submit" name="signup">Sign Up</button>
              </td>

              <!-- Login -->
              <td>
                  <button type="submit" name="login">Login</button>
              </td>

              <!-- Reset -->
              <td><button type="reset">Reset</button></td>
           </tr>
         </table>
      </form>
   </body>
</html>
