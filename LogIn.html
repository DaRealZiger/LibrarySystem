<html>
   <head>
      <title>Log In</title>
      <h1 align=center>Log In</h1>
   </head>
   <body>
      <table align="center" >
         <!-- Username -->
         <tr>
            <td width="200">Username</td>
            <td width="200"></td>
            <td width="200"></td>
         </tr>
         <tr>
            <td colspan="3">
               <input type="text" name="username" size="90">
            </td>
         </tr>

         <!-- Space -->
         <tr><td colspan="3" height="50"></td></tr>

         <!-- Password -->
         <tr>
            <td>Password</td>
         </tr>
         <tr>
            <td colspan="3">
               <input type="text" name="psw" size="90">
            </td>
         </tr>

         <!-- Space -->
         <tr><td colspan="3" height="25"></td></tr>

        <!-- Button  -->
        <tr>
           <!-- Sign Up Button  -->
           <form action="SignUp.html">
           <td align="right"><button type="SignUp">Sign Up</button></td>
           </form>
           <td align="center"><button type="Login">Login</button></td>
           <td><button type="Reset">Reset</button></td>
        </tr>
      </table>
   </body>
</html>
