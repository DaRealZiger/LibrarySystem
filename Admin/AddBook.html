<html>
    <head>
        <title>Add Book</title>
    </head>
    <body>
        <header>
            <h1 align=center>Add Book</h1>
        </header>

        <form>
            <!-- <table border="1" align="center" > -->
            <table align="center" >
                <!-- Title -->
                <tr>
                    <td width="10"></td>
                    <td>Title</td>
                </tr>

                <!-- Title form -->
                <tr>
                    <td></td>
                    <td>
                        <input type="text" name="title" placeholder="Insert Title" size="90">
                    </td>
                </tr>

                <!-- Space -->
                <tr><td height="50" colspan=5></td></tr>

                <!-- Language -->
                <tr>
                    <td></td>
                    <td>Language</td>
                </tr>

                <!-- Language Form -->
                <tr>
                    <td></td>
                    <td>
                        <input type="text" name="language" placeholder="Insert Language" size="90">
                    </td>
                </tr>

                <!-- Space -->
                <tr><td height="50" colspan=5></td></tr>

                <!-- Author -->
                <tr>
                    <td width="10"></td>
                    <td>Author</td>
                </tr>

                <!-- Author form -->
                <tr>
                    <td></td>
                    <td>
                        <input type="text" name="author" placeholder="Insert Author" size="90">
                    </td>
                </tr>

                <!-- Space -->
                <tr><td height="50" colspan=5></td></tr>

                <!-- Publisher -->
                <tr>
                    <td width="10"></td>
                    <td>Publisher</td>
                </tr>

                <!-- Publisher form -->
                <tr>
                    <td></td>
                    <td>
                        <input type="text" name="author" placeholder="Insert Publisher" size="90">
                    </td>
                </tr>

                <!-- Space -->
                <tr><td height="25" colspan=5></td></tr>

                <!-- Buttons -->
                <tr>
                    <td colspan=2>
                        <table>
                            <tr>
                                <!-- To push buttons to the right  -->
                                <td align ="right" width="270"></td>

                                <!-- Add Book Button  -->
                                <td><button type="submit">Add Book</button></td>

                                <!-- Button seperator  -->
                                <td width="10"></td>

                                <!-- Reset Button -->
                                <td align="left" width="270"><button type="reset">Reset</button></td>
        </form>
                                <!-- Back Button -->
                                <form action="./CatalogueAdmin.html">
                                    <td><button type="submit">Back</button></td>
                                </form>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
    </body>
</html>
