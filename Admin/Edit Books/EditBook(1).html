<html>
    <head>
        <title>Edit Book</title>
    </head>
    <body>
        <header>
            <h1 align=center>Edit Book</h1>
        </header>

        <form>
            <!-- <table border="1" align="center" > -->
            <table align="center" >
                <!-- Title -->
                <tr>
                    <td width="10"></td>
                    <td>Title</td>
                </tr>

                <!-- Title form -->
                <tr>
                    <td></td>
                    <td>
                        <input type="text" name="title" value="Patung Hina Hidup?" size="90">
                    </td>
                </tr>

                <!-- Space -->
                <tr><td height="50" colspan=5></td></tr>

                <!-- Language -->
                <tr>
                    <td></td>
                    <td>Language</td>
                </tr>

                <!-- Language Form -->
                <tr>
                    <td></td>
                    <td>
                        <input type="text" name="language" value="Malay" size="90">
                    </td>
                </tr>

                <!-- Space -->
                <tr><td height="50" colspan=5></td></tr>

                <!-- Author -->
                <tr>
                    <td width="10"></td>
                    <td>Author</td>
                </tr>

                <!-- Author form -->
                <tr>
                    <td></td>
                    <td>
                        <input type="text" name="author" value="Honobu Yonezawa" size="90">
                    </td>
                </tr>

                <!-- Space -->
                <tr><td height="50" colspan=5></td></tr>

                <!-- Publisher -->
                <tr>
                    <td width="10"></td>
                    <td>Publisher</td>
                </tr>

                <!-- Publisher form -->
                <tr>
                    <td></td>
                    <td>
                        <input type="text" name="author" value="Kadokawa" size="90">
                    </td>
                </tr>

                <!-- Space -->
                <tr><td height="25" colspan=5></td></tr>

                <!-- Button  -->
                <tr>
                    <td colspan=2>
                        <table>
                            <tr>
                                <td align ="right" width="270"></td>
                                <td><button type="submit">Edit Book</button></td>
                                <td width="10"></td>
                                <td align="left" width="270"><button type="reset">Reset</button></td>
                                <td><button type="submit">Back</button></td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
