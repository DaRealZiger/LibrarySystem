<html>
    <head>
        <title>Sign Up</title>
    </head>
    <body>
        <header>
            <h1 align=center>Sign Up</h1>
        </header>

        <form>
            <!-- <table border="1" align="center" > -->
            <table align="center" >
                <!-- Username -->
                <tr>
                    <td width="10"></td>
                    <td>Username</td>
                </tr>

                <!-- Username form -->
                <tr>
                    <td></td>
                    <td>
                        <input type="text" name="username" size="90">
                    </td>
                </tr>

                <!-- Space -->
                <tr><td height="50" colspan=5></td></tr>

                <!-- Password -->
                <tr>
                    <td></td>
                    <td>Password</td>
                </tr>

                <!-- Password Form -->
                <tr>
                    <td></td>
                    <td>
                        <input type="text" name="pwd" size="90">
                    </td>
                </tr>

                <!-- Space -->
                <tr><td height="50" colspan=5></td></tr>

                <!-- Confirm Password -->
                <tr>
                    <td></td>
                    <td>Confirm Password</td>
                </tr>

                <!-- Confirm Password Form -->
                <tr>
                    <td></td>
                    <td>
                        <input type="text" name="confpwd" size="90">
                    </td>

                    <!-- Space -->
                    <tr><td height="25" colspan=5></td></tr>

                    <!-- Button  -->
                    <tr>
                        <td colspan=2>
                            <table>
                                <tr>
                                    <td align ="right" width="270"></td>
                                    <td><button type="submit">Sign Up</button></td>
                                    <td width="10"></td>
                                    <td align="left" width="270"><button type="reset">Reset</button></td>
        </form>
                                    <form action=./LogIn.html>
                                    <td><button type="submit">Back</button></td>
                                    </form>
                                </tr>
                            </table>
                        </td>
                    </tr>
            </table>
    </body>
</html>
