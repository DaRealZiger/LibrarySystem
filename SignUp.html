<html>
    <head>
        <title>Sign Up</title>
    </head>
    <body bgcolor="#ECD8C6">
        <header>
            <table>
                <tr><td bgcolor="#603E20"><img src="src/Banner.jpg" alt="Banner"  width="1290" height="100"></td></tr>
                <tr>
                    <td bgcolor="#603E20">
                        <marquee scrollamount="20"><h1><font color="white">Sign Up</font></h1></marquee>
                    </td>
                </tr>
            </table>
        </header>

        <!-- <table align="center" border="3" style=border-color:red;> -->
        <table align="center">
            <!-- Space -->
            <tr><td height="50" colspan=5></td></tr>

            <tr>
                <td colspan="2">
                    <form>
                        <!-- <table border="3" style="border-color:blue;"> -->
                        <table>
                            <!-- Username -->
                            <tr>
                                <td width="10"></td>
                                <td>Username</td>
                            </tr>

                            <!-- Username form -->
                            <tr>
                                <td></td>
                                <td>
                                    <input  required type="text" name="username" placeholder="Insert Username" size="90">
                                </td>
                            </tr>

                            <!-- Space -->
                            <tr><td height="50" colspan=5></td></tr>

                            <!-- Password -->
                            <tr>
                                <td></td>
                                <td>Password</td>
                            </tr>

                            <!-- Password Form -->
                            <tr>
                                <td></td>
                                <td>
                                    <input required type="text" name="pwd" placeholder="Insert Password" size="90">
                                </td>
                            </tr>

                            <!-- Space -->
                            <tr><td height="50" colspan=5></td></tr>

                            <!-- Confirm Password -->
                            <tr>
                                <td></td>
                                <td>Confirm Password</td>
                            </tr>

                            <!-- Confirm Password Form -->
                            <tr>
                                <td></td>
                                <td>
                                    <input required type="text" name="confpwd" placeholder="Confirm Password" size="90">
                                </td>
                            </tr>
                            <!-- Space -->
                            <tr><td height="25" colspan=5></td></tr>

                            <!-- Buttons -->
                            <tr>
                                <td colspan=2>
                                    <!-- <table border="3" style="border-color:green;"> -->
                                    <table>
                                        <tr>
                                            <!-- To push buttons to the right  -->
                                            <td align ="right" width="270"></td>

                                            <!-- Sign Up Button -->
                                            <td><button type="submit">Sign Up</button></td>

                                            <!-- Button seperator  -->
                                            <td width="10"></td>

                                            <!-- Reset Button -->
                                            <td align="left" width="270"><button type="reset">Reset</button></td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </form>
                </td>
            </tr>
            <tr>
                <td width="605">
                </td>
                <td>
                    <!-- Back Button -->
                    <form action=./LogIn.html>
                        <button type="submit">Back</button>
                    </form>
                </td>
            </tr>
        </table>
    </body>
</html>
